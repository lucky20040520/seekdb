name: MiniVectorDB long case differential
on:
  push:
    branches: [codex/minivectordb-cpp-migration]
    paths: [tools/compare_long_case.py, .github/workflows/minivector-long-case.yml]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            sha: f1b9f4e204f08f5043b315ba1ebec500ad7af255
          - name: cpp
            sha: 28d7bf0418ee3f3a82dbb498522ba1905d66a3ef
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact submission
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          git fetch --depth=1 origin "$SOURCE_SHA"
          mkdir build-source
          git archive "$SOURCE_SHA" Dockerfile requirements.txt minivector $(if [ "${{ matrix.name }}" = cpp ]; then printf cpp; fi) | tar -x -C build-source
          docker build --platform linux/amd64 -t replay build-source
      - name: Run long SQL case under the public driver deadline
        run: python3 tools/compare_long_case.py --image replay --output results/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-case-${{ matrix.name }}
          path: results/
