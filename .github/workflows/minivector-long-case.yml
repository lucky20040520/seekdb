name: MiniVectorDB long case differential
on:
  push:
    branches: [codex/minivectordb-cpp-migration]
    paths: [cpp/**, tools/compare_long_case.py, .github/workflows/minivector-long-case.yml]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpp-baseline
            sha: 28d7bf0418ee3f3a82dbb498522ba1905d66a3ef
          - name: cpp-candidate
            sha: ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact submission
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          if ! git cat-file -e "$SOURCE_SHA^{commit}"; then
            git fetch --depth=1 origin "$SOURCE_SHA"
          fi
          mkdir build-source
          git archive "$SOURCE_SHA" Dockerfile cpp | tar -x -C build-source
          docker build --platform linux/amd64 -t replay build-source
      - name: Run long SQL case under the public driver deadline
        run: python3 tools/compare_long_case.py --image replay --output results/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-case-${{ matrix.name }}
          path: results/
