name: MiniVectorDB local acceptance
on:
  push:
    branches: [2026-competition-round2]
    paths: [cpp/**, minivector/**, tests/**, tools/**, mysqltest/**, agent/**, conversation.json, Dockerfile, Dockerfile.python, requirements.txt, .github/workflows/minivector.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate learning material
        run: python3 tools/validate_material.py agent/conversation.json
      - name: Build C++ database from source
        run: docker build -t minivector-local .
      - name: Check C++ entrypoint examples and runtime file scope
        run: python3 tools/check_delivery.py --image minivector-local
      - name: Check actual C++ transactions recovery and boundaries
        run: python3 tools/test_cpp.py --docker-image minivector-local --output protocol-results/cpp-regression.json
      - name: Run published JSONL assertions against C++
        run: python3 protocol_check/run.py --image minivector-local --output protocol-results/cpp-public
      - name: Explain scope
        run: echo 'These are self-tests, not official MySQL admission or platform scores.'
      - name: Preserve C++ reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minivector-cpp-regression
          path: protocol-results/
